<html><head><meta charset='utf-8'>
<style>
.tbl-sim{border-collapse:collapse;margin:10px 0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px}
.tbl-sim caption{caption-side:top;font-weight:bold;margin-bottom:6px;text-align:left}
.tbl-sim th,.tbl-sim td{border:1px solid #dee2e6;padding:6px 10px;text-align:center}
.tbl-sim thead th{background:#f1f3f5}
.tbl-sim th:first-child{background:#fafafa;text-align:left}
.tbl-sim .muted{color:#adb5bd}.tbl-sim .sub{font-size:11px;color:#6c757d}
.tbl-sim .bold{font-weight:bold}
.tbl-sim .alloc{background:#fff3cd;border:2px solid #f0ad4e}
.tbl-sim .rhs{background:#e7f1fb}
</style><style>
    .hdr{font-weight:600;margin:6px 0}
    .note{color:#6c757d;font-size:12px}
    .tbl-sim .uv { color:#495057; font-size:12px }
    .tbl-sim .neg { background:#fdecea; border:2px solid #f5c2c7 }
    .tbl-sim .rbox{font-size:12px;margin-top:2px}
    .tbl-sim .costpill{position:absolute;top:6px;right:6px;border:1px solid #adb5bd;border-radius:6px;padding:1px 6px;font-size:12px;color:#495057}
    .cellwrap{position:relative;min-width:84px;height:46px}
    .alloc .big{font-weight:700}
    .muted{color:#adb5bd}
    .pivot{
      background:#e8f0fe !important;                 
      box-shadow: inset 0 0 0 3px #1a73e8; 
    }
    /* NEW: degenerate basic (basis=1 & x=0) */
    .deg{
      background:#f3e8ff !important;                 /* soft purple */
      border:2px dashed #7c3aed !important;
    }
    .deg .badge{
      display:inline-block;border:1px solid #7c3aed;border-radius:999px;
      font-size:11px;padding:0 6px;margin-right:4px;color:#7c3aed;background:#fff
    }
  </style>
</head><body>
<table class='tbl-sim'><thead><tr><th></th>
<th>Garaj 1<br><span class='uv'>v<sub>1</sub> = 13</span></th>
<th>Garaj 2<br><span class='uv'>v<sub>2</sub> = 17</span></th>
<th>Garaj 3<br><span class='uv'>v<sub>3</sub> = 21</span></th>
<th>Garaj 4<br><span class='uv'>v<sub>4</sub> = 30</span></th>
<th class='rhs'>Arz</th></tr></thead><tbody>
<tr>
<th>Merkez 1<br><span class='uv'>u<sub>1</sub> = 0</span></th>
<td class=''><div class='cellwrap'><div class='costpill'>c=45</div><div class='muted'>&ndash;</div></div><div class='rbox'>R=32</div></td>
<td class='alloc'><div class='cellwrap'><div class='costpill'>c=17</div><div class='big'>6</div></div><div class='rbox'><span class='muted'>R=–</span></div></td>
<td class='alloc'><div class='cellwrap'><div class='costpill'>c=21</div><div class='big'>7</div></div><div class='rbox'><span class='muted'>R=–</span></div></td>
<td class='alloc'><div class='cellwrap'><div class='costpill'>c=30</div><div class='big'>2</div></div><div class='rbox'><span class='muted'>R=–</span></div></td>
<td class='rhs bold'>15</td></tr>
<tr>
<th>Merkez 2<br><span class='uv'>u<sub>2</sub> = 1</span></th>

<td class=''><div class='cellwrap'><div class='costpill'>c=18</div><div class='muted'>&ndash;</div></div><div class='rbox'>R=0</div></td>
<td class='neg pivot'><div class='cellwrap'><div class='costpill'>c=19</div><div class='muted'>&ndash;</div></div><div class='rbox'>R=-3</div></td>
<td class='alloc'><div class='cellwrap'><div class='costpill'>c=31</div><div class='big'>4</div></div><div class='rbox'><span class='muted'>R=–</span></div></td>
<td class='rhs bold'>13</td></tr>
<tr>
<th>Dummy<br><span class='uv'>u<sub>3</sub> = -30</span></th>
<td class=''><div class='cellwrap'><div class='costpill'>c=0</div><div class='muted'>&ndash;</div></div><div class='rbox'>R=17</div></td>
<td class=''><div class='cellwrap'><div class='costpill'>c=0</div><div class='muted'>&ndash;</div></div><div class='rbox'>R=13</div></td>
<td class=''><div class='cellwrap'><div class='costpill'>c=0</div><div class='muted'>&ndash;</div></div><div class='rbox'>R=9</div></td>
<td class='alloc'><div class='cellwrap'><div class='costpill'>c=0</div><div class='big'>3</div></div><div class='rbox'><span class='muted'>R=–</span></div></td>
<td class='rhs bold'>3</td></tr>
<tr><th>Talep</th>
<td class='rhs bold'>9</td>
<td class='rhs bold'>6</td>
<td class='rhs bold'>7</td>
<td class='rhs bold'>9</td>
<td class='rhs bold'>31</td></tr>
</tbody></table>
